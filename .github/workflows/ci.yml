name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: C and C++ protocol tests (warnings as errors, sanitizers)
        run: python firmware/build.py --test --sanitize
      - name: Tests (no camera or mouse needed)
        run: python -m pytest -q -m "not hardware"
