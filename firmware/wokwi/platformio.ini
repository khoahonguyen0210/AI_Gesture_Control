; Firmware for the Wokwi demo. Build: pio run -d firmware/wokwi
; The protocol and device code come from firmware/src, the same files the laptop tests use.

[platformio]
src_dir = .

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_src_filter = +<sketch.ino.cpp>
extra_scripts = pre:shared_sources.py
build_flags = -Wall -Wextra -I../src
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
